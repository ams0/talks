            - listitem: —The vendor holds the pricing power and the terms of service
            - listitem: —Genuinely the best capability available — that is why it is tempting
        - generic:
          - paragraph: Tier 2
          - heading "Open weights" [level=3]
          - paragraph: Llama 4 · DeepSeek R1
