      - heading "\"Open weights\" is not the same thing as an open model" [level=2]
      - paragraph: The substrate is solved. The model layer is not — and the word "open" is doing a great deal of work in vendor marketing right now. There are three tiers, and only one of them survives the sovereignty test.
